name: Release

on:
  push:
    tags: ['v*']

# A re-run or a force-pushed tag must not race a second publish against the
# first. Never cancel in progress: a run cancelled between `npm publish` and the
# GitHub release leaves the package out with nothing announcing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same matrix that guards main, not a second copy of it. A tag that would
  # not have passed CI does not get published.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest

    # Somewhere to hang a required reviewer later: an npm publish is not
    # reversible after 72 hours, and this is the only step in the repo that
    # needs a human gate.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@naijacloud/argus

    permissions:
      # Trusted publishing. npm exchanges this run's OIDC token for a publish
      # credential that lives for minutes and mints the provenance attestation
      # from the same claim, so there is no NPM_TOKEN in this repo to leak, to
      # rotate, or for another workflow to read. A long-lived token in a public
      # repo's secrets is exactly the supply-chain risk this avoids.
      id-token: write
      # `gh release create`.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing landed in npm 11.5.1. The npm bundled with Node 22
      # predates it and would fall through to looking for a token that is not
      # there, failing with an auth error that says nothing about the cause.
      - name: Upgrade npm to a version that can publish with OIDC
        run: npm install -g npm@latest

      - run: npm ci

      # Also emits the version, the dist-tag and whether this is a prerelease,
      # so the semver rule lives in the script rather than in shell here.
      - name: Check the tag against the package
        id: version
        # Through the environment, not interpolated into the script body: a ref
        # name is attacker-shaped input.
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs --tag "$TAG"

      - run: npm run build

      - name: Check what would be uploaded
        run: npm run check:tarball

      # `prepublishOnly` runs the version check, the build and the suite once
      # more inside this command. That repetition is the point: it is the last
      # gate before an upload npm will not take back.
      - name: Publish to npm
        # No --provenance flag. Under trusted publishing npm attests from the
        # OIDC claim on its own, and NODE_AUTH_TOKEN is deliberately unset.
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.npm_tag }}
        run: npm publish --tag "$NPM_DIST_TAG"

      - name: Build the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog-notes.mjs "$VERSION" > notes.md

      # npm first, then the release. If this step fails the package is out and
      # the release is one command away; the other order announces a version
      # that does not exist yet.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${flags[@]}"
